<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estagia Ai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/home_empresas.css">
</head>

<body>
    <header class="top-nav-wrapper">
        <nav class="top-nav">
            <a href="/home/empresa" class="brand" aria-label="Ir para página inicial">
                <span class="brand-dot"></span>
                <span class="brand-text">Estagia Ai</span>
            </a>

            <ul class="nav-list" aria-label="Navegação principal">
                <li><a href="/home/empresa" class="nav-btn active">Home</a></li>
                <li><a href="/empresas" class="nav-btn">Empresas</a></li>
            </ul>

            <div class="actions">
                <form class="search-form" role="search" aria-label="Buscar na plataforma">
                    <label for="global-search" class="sr-only">Buscar</label>
                    <input
                        id="global-search"
                        class="search-input"
                        type="search"
                        placeholder="Pesquisar"
                        autocomplete="off"
                    >
                </form>

                <div class="profile-dropdown">
                    <button
                        id="profileMenuButton"
                        class="avatar-btn"
                        type="button"
                        aria-haspopup="true"
                        aria-expanded="false"
                        aria-label="Abrir menu do perfil"
                    >
                        <span class="avatar-circle">FF</span>
                        <span class="avatar-name"></span>
                    </button>

                    <div id="profileMenu" class="dropdown-menu" role="menu" aria-hidden="true">
                        <a href="/perfil" class="dropdown-item" role="menuitem">Acessar perfil</a>
                        <a href="/logout" class="dropdown-item danger" role="menuitem">Logout</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="home-content">
        <section class="hero-card">
            <p class="hero-kicker">Plataforma de estagios</p>
            <h1>Bem-vindo ao Estagia Ai</h1>
            <p>Gerencie suas vagas de estagio e acompanhe os candidatos.</p>
        </section>

        <section class="vagas-section" aria-label="Minhas vagas">
            <div class="vagas-section-header">
                <h2>Minhas vagas</h2>
                <button type="button" id="btnNovaVaga" class="btn-primary">Nova Vaga</button>
            </div>
            <div id="vagasEmpresa"></div>
        </section>
    </main>

    <script src="/js/date-utils.js"></script>
    <script src="/js/scriptHome.js"></script>
    <script src="/js/scriptHomeEmpresa.js"></script>
</body>
</html>
