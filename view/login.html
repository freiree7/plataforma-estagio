
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>Faça o seu login</h2>
                
            </div>
            
            <form class="login-form" id="loginForm" action="#" novalidate>
                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="text" id="identificador" name="identificador" required autocomplete="username">
                        <label for="identificador">Email, CNPJ ou RA</label>
                    </div>
                    <span class="error-message" id="identificadorError"></span>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" required autocomplete="current-password">
                        <label for="password">Senha</label>
                        <button type="button" class="password-toggle" id="passwordToggle" aria-label="Toggle password visibility">
                            <span class="toggle-icon"></span>
                        </button>
                    </div>
                    <span class="error-message" id="passwordError"></span>
                </div>



                <button type="submit" class="login-btn">
                    <span class="btn-text">Entrar</span>
                    <span class="btn-loader"></span>
                </button>

                <div class="register-link">
                    <p>Não possui uma conta? <a href="/cadastro">Clique aqui para se cadastrar</a></p>
                </div>
                </form>


            </form>

           

    <script src="/js/form-utils.js"></script>
    <script src="/js/script.js"></script>
</body>
</html>
